name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:unit

      - name: Matching database regression
        env:
          PGLITE_MODULE: ${{ runner.temp }}/matching-audit/node_modules/@electric-sql/pglite/dist/index.js
          ESBUILD_MODULE: ${{ runner.temp }}/matching-audit/node_modules/esbuild/lib/main.js
        run: |
          npm install --prefix "$RUNNER_TEMP/matching-audit" --no-save --package-lock=false @electric-sql/pglite@0.3.14 esbuild@0.27.7
          node supabase/audits/matching-cancellation-boundary-pglite.mjs
          node supabase/audits/matching-eligibility-diagnostics-pglite.mjs
          node supabase/audits/matching-phase5-flow-pglite.mjs
          node supabase/audits/matching-adjustment-pglite.mjs
          node supabase/audits/matching-publication-preflight-pglite.mjs
          node supabase/audits/test-account-pool-pglite.mjs

      - name: Production build
        run: pnpm run build
